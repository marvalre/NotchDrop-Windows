[package]
name = "notchdrop"
version = "0.1.0"
description = "A Dynamic Island for Windows: player, clipboard, alarms, currency and notes at the top of the screen."
edition = "2021"
license = "MIT"

[lib]
name = "notchdrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-notification = "2"
tauri-plugin-autostart = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
arboard = "3"
base64 = "0.22"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Media_Control",
  "Foundation",
  "Storage_Streams",
  "Win32_Foundation",
  "Win32_System_DataExchange",
  "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
lto = true
codegen-units = 1
strip = true
opt-level = "s"
