name: Windows build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install
        run: npm ci

      - name: Frontend tests
        run: npm test

      - name: Download the ffmpeg build the app installs (for the real conversion test)
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/ff"
          for t in ffmpeg ffprobe; do
            curl -sSL -o "$RUNNER_TEMP/ff/$t.gz" "https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1/$t-win32-x64.gz"
            gunzip -c "$RUNNER_TEMP/ff/$t.gz" > "$RUNNER_TEMP/ff/$t.exe"
          done
          # Same pinned digests as src-tauri/src/tools.rs.
          echo "8883a3dffbd0a16cf4ef95206ea05283f78908dbfb118f73c83f4951dcc06d77  $RUNNER_TEMP/ff/ffmpeg.gz" | sha256sum -c -
          echo "f309e6223ad89d2fe54bccd420a7709b66fd27540674e92309578ed491a43c8d  $RUNNER_TEMP/ff/ffprobe.gz" | sha256sum -c -
          echo "NOTCHDROP_FFMPEG=$RUNNER_TEMP/ff/ffmpeg.exe" >> "$GITHUB_ENV"
          echo "NOTCHDROP_FFPROBE=$RUNNER_TEMP/ff/ffprobe.exe" >> "$GITHUB_ENV"

      - name: Rust tests (real Windows — SMTC/clipboard code, real ffmpeg conversions)
        working-directory: src-tauri
        run: cargo test -- --nocapture

      - name: Build installers (signed for the in-app updater)
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: npx tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: NotchDrop-Windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe)
          sig="$exe.sig"
          [ -s "$sig" ] || { echo "Falta la firma del instalador ($sig): ¿están los secretos de firma?"; exit 1; }
          version="${GITHUB_REF_NAME#v}"
          url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$exe")"
          # What installed copies read to find, verify and install this version.
          node -e '
            const fs = require("fs");
            const [version, url, sigPath] = process.argv.slice(1);
            fs.writeFileSync("latest.json", JSON.stringify({
              version, notes: "NotchDrop para Windows " + version, pub_date: new Date().toISOString(),
              platforms: { "windows-x86_64": { signature: fs.readFileSync(sigPath, "utf8").trim(), url } },
            }, null, 2));' "$version" "$url" "$sig"
          files=("$exe" "$sig" src-tauri/target/release/bundle/msi/*.msi latest.json)
          # Re-running the workflow for a tag whose release already exists must not fail.
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${files[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${files[@]}" \
              --title "NotchDrop para Windows ${GITHUB_REF_NAME}" \
              --notes "Instalador para Windows 10/11. Descarga el .exe y ábrelo. Desde la 0.4.0, la app se actualiza sola con un clic (Ajustes → Actualizaciones)."
          fi
